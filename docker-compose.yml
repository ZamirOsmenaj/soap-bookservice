# =============================================================================
# Docker Compose — Book Service Demo
# =============================================================================
# Three services:
#
#   book-server   → The SOAP server. Publishes two endpoints:
#                   http://localhost:8080/getbook
#                   http://localhost:8080/createbook
#
#   book-client   → Auto-generated client. Uses Maven + wsimport to build,
#                   then runs BookClient.java against the server.
#                   Exits after completing all demo calls.
#
#   dev-tools     → Interactive container. Has JDK8 + wsimport + Ant.
#                   Stays alive so you can exec into it and run commands manually.
#                   This is the "manual workflow" container.
# =============================================================================

services:

  # ─── SOAP Server ────────────────────────────────────────────────────────────
  book-server:
    build:
      context: ./book-server
      dockerfile: Dockerfile
    container_name: book-server
    ports:
      # Expose both endpoints to your host machine so you can:
      #   • Browse the WSDLs at http://localhost:8080/getbook?wsdl
      #   • Use curl to send raw SOAP requests
      - "8080:8080"
    networks:
      - bookservice-net
    healthcheck:
      # The server is "healthy" when the GetBook WSDL responds
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/getbook?wsdl | grep -q 'GetBookService' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ─── Auto-generated Client (Maven + wsimport) ────────────────────────────────
  book-client:
    build:
      context: ./book-client
      dockerfile: Dockerfile
    container_name: book-client
    depends_on:
      book-server:
        condition: service_healthy
    networks:
      - bookservice-net
    # This container exits after printing its demo output.
    # That is intentional — it is a one-shot client, not a long-running service.

  # ─── Dev Tools (manual workflow) ─────────────────────────────────────────────
  dev-tools:
    build:
      context: ./dev-tools
      dockerfile: Dockerfile
    container_name: dev-tools
    depends_on:
      book-server:
        condition: service_healthy
    networks:
      - bookservice-net
    # Stays alive so you can connect with: docker exec -it dev-tools bash
    # CMD in Dockerfile is: tail -f /dev/null
    stdin_open: true
    tty: true

networks:
  bookservice-net:
    driver: bridge
